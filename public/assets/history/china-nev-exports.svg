<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">中国新能源汽车驶向海外科普插图</title>
  <desc id="desc">一艘装载新能源汽车的运输船从中国港口出发，沿海上航线驶向海外市场；画面展示 2025 年出口数据。</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f4f1e9"/><stop offset="1" stop-color="#d9dfda"/></linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d8e4df"/><stop offset="1" stop-color="#b6cbc6"/></linearGradient>
    <linearGradient id="ship" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#3e4b49"/><stop offset="1" stop-color="#202a2a"/></linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#252d2a" flood-opacity=".16"/></filter>
  </defs>
  <rect width="1200" height="720" fill="url(#paper)"/>
  <path d="M0 0h16v720H0Z" fill="#b9342a"/>
  <text x="62" y="76" fill="#a23a31" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="18" letter-spacing="5">中国智造 · 海外新航线</text>
  <text x="62" y="136" fill="#292c2a" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="38" font-weight="700">新能源车，驶向世界</text>
  <text x="64" y="172" fill="#626761" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="17">从中国港口出发，去往不同国家和地区</text>


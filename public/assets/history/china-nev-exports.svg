    <path d="m8 83 48-49 48-14 27-28 48 8 18 23 37 10 6 28-18 19-8 32-32 13-23 31-35-7-15-28-31-4-17-26-34 9Z" fill="#e8e4d7" stroke="#8e9b94" stroke-width="3"/>

  <text x="64" y="658" fill="#686d67" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="15">出口，就是把在中国生产的汽车运到其他国家和地区。</text>
  <text x="1122" y="658" text-anchor="end" fill="#a43a31" font-family="Arial,sans-serif" font-size="13" letter-spacing="3">CHINA → WORLD</text>
